name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python stress/fuzz.py --cases 500 --seed 1
      - run: python -m convlint lint examples/ --format json > /dev/null || test $? -eq 1
      - run: python -m convlint lint examples/good_first_call.txt --format json > /dev/null
